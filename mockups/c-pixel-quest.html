<title>Fahmi's Quest — Muhammad Fahmi Ady Susilo (concept C)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --ink: #1b1530;
    --paper: #fff8e7;
    --gold: #fbbf24;
    --red: #ef4444;
    --teal: #14b8a6;
    --orange: #f97316;
    --grass: #4ade80;
    --pix: "Press Start 2P", monospace;
    --body: "Pixelify Sans", system-ui, sans-serif;
    --u: 1px;
    --sky1: #ffcf8a; --sky2: #ff9e7a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 17px/1.45 var(--body); color: var(--ink); background: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: #1d4ed8; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(var(--sky1), var(--sky2)); touch-action: none; user-select: none; }
  .layer { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
  .sun { position: absolute; width: calc(var(--u) * 90); height: calc(var(--u) * 90); border-radius: 50%; background: #fff3c4; box-shadow: 0 0 0 calc(var(--u) * 10) rgba(255,243,196,.35); top: calc(var(--u) * 120); right: 12%; }
  .cloud { position: absolute; image-rendering: pixelated; }
  .hills { position: absolute; bottom: calc(var(--u) * 110); height: calc(var(--u) * 200); width: 100%; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 120);
    background:
      linear-gradient(#22c55e 0 calc(var(--u) * 14), #15803d calc(var(--u) * 14) calc(var(--u) * 22), transparent calc(var(--u) * 22)),
      repeating-linear-gradient(90deg, #a16207 0 calc(var(--u) * 24), #92400e calc(var(--u) * 24) calc(var(--u) * 48)); }
  .ground::after { content: ""; position: absolute; inset: calc(var(--u) * 22) 0 0; background: repeating-linear-gradient(0deg, transparent 0 calc(var(--u) * 22), rgba(0,0,0,.12) calc(var(--u) * 22) calc(var(--u) * 24)); }

  /* world objects */
  .obj { position: absolute; bottom: calc(var(--u) * 120); }
  .bld { border: calc(var(--u) * 4) solid var(--ink); background: var(--c, #fde68a); box-shadow: inset calc(var(--u) * -10) 0 0 rgba(0,0,0,.12); }
  .bld .win { position: absolute; inset: calc(var(--u) * 26) calc(var(--u) * 16) calc(var(--u) * 46); background:
      repeating-linear-gradient(90deg, transparent 0 calc(var(--u) * 10), var(--c) calc(var(--u) * 10) calc(var(--u) * 26)),
      repeating-linear-gradient(0deg, transparent 0 calc(var(--u) * 18), var(--c) calc(var(--u) * 18) calc(var(--u) * 30)),
      var(--w, #60a5fa); }
  .bld .door { position: absolute; bottom: 0; left: 50%; width: calc(var(--u) * 34); height: calc(var(--u) * 44); transform: translateX(-50%); background: var(--ink); }
  .roof { position: absolute; left: calc(var(--u) * -18); right: calc(var(--u) * -18); bottom: 100%; height: calc(var(--u) * 60); background: var(--r, #b91c1c); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .sign { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font: calc(var(--u) * 12)/1.2 var(--pix); background: var(--paper); border: calc(var(--u) * 3) solid var(--ink); padding: calc(var(--u) * 6) calc(var(--u) * 8); box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 var(--ink); }
  .qblock { width: calc(var(--u) * 56); height: calc(var(--u) * 56); background: var(--gold); border: calc(var(--u) * 4) solid var(--ink); display: grid; place-items: center; font: calc(var(--u) * 22) var(--pix); color: #92400e; box-shadow: inset calc(var(--u) * -6) calc(var(--u) * -6) 0 #d97706; transition: transform .15s; }
  .qblock.hit { background: #c08a3e; color: transparent; transform: translateY(calc(var(--u) * -10)); }
  .coin { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 0); white-space: nowrap; font: calc(var(--u) * 10) var(--pix); color: var(--ink); background: var(--paper); border: calc(var(--u) * 2) solid var(--ink); padding: calc(var(--u) * 3) calc(var(--u) * 6); opacity: 0; transition: transform .5s, opacity .5s; pointer-events: none; }
  .qblock.hit .coin { opacity: 1; transform: translate(-50%, calc(var(--u) * -18)); }
  .cab { width: calc(var(--u) * 120); height: calc(var(--u) * 210); background: var(--c, #7c3aed); border: calc(var(--u) * 4) solid var(--ink); padding: calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 6); box-shadow: inset calc(var(--u) * -8) 0 0 rgba(0,0,0,.2); }
  .cab:hover { transform: translateY(calc(var(--u) * -6)); }
  .cab .mq { font: calc(var(--u) * 8)/1.3 var(--pix); color: #fff; text-align: center; min-height: calc(var(--u) * 22); overflow: hidden; }
  .cab img { width: 100%; height: calc(var(--u) * 78); object-fit: cover; object-position: top; border: calc(var(--u) * 3) solid var(--ink); image-rendering: auto; }
  .cab .pad { margin-top: auto; height: calc(var(--u) * 40); background: rgba(0,0,0,.25); border: calc(var(--u) * 3) solid var(--ink); position: relative; }
  .cab .pad::before, .cab .pad::after { content: ""; position: absolute; top: calc(var(--u) * 10); width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; background: var(--red); left: calc(var(--u) * 14); }
  .cab .pad::after { background: var(--gold); left: auto; right: calc(var(--u) * 14); }
  .flag { width: calc(var(--u) * 8); height: calc(var(--u) * 300); background: #e5e7eb; border: calc(var(--u) * 2) solid var(--ink); }
  .flag::after { content: ""; position: absolute; left: 100%; top: calc(var(--u) * 6); width: calc(var(--u) * 90); height: calc(var(--u) * 60); background: var(--red); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .mailbox { width: calc(var(--u) * 70); height: calc(var(--u) * 50); background: #2563eb; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 26) calc(var(--u) * 26) 0 0; }
  .mailbox::after { content: ""; position: absolute; left: 45%; top: 100%; width: calc(var(--u) * 10); height: calc(var(--u) * 70); background: var(--ink); }
  .books { width: calc(var(--u) * 260); height: calc(var(--u) * 200); background: #7c2d12; border: calc(var(--u) * 4) solid var(--ink); display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: calc(var(--u) * 3); padding: calc(var(--u) * 8); }
  .books i { display: block; border: calc(var(--u) * 2) solid var(--ink); }
  .trophy { width: calc(var(--u) * 46); height: calc(var(--u) * 50); background: var(--gold); border: calc(var(--u) * 4) solid var(--ink); border-radius: 0 0 calc(var(--u) * 22) calc(var(--u) * 22); }
  .trophy::after { content: ""; position: absolute; left: 30%; top: 100%; width: 40%; height: calc(var(--u) * 26); background: #92400e; border: calc(var(--u) * 3) solid var(--ink); }
  .tree { width: calc(var(--u) * 70); height: calc(var(--u) * 130); }
  .tree::before { content: ""; position: absolute; left: 38%; bottom: 0; width: 24%; height: 45%; background: #78350f; border: calc(var(--u) * 3) solid var(--ink); }
  .tree::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 70%; background: #16a34a; border: calc(var(--u) * 4) solid var(--ink); border-radius: 40% 40% 30% 30%; }

  .hero { position: absolute; bottom: calc(var(--u) * 116); width: calc(var(--u) * 60); height: calc(var(--u) * 80); image-rendering: pixelated; z-index: 3; }
  .hero svg { width: 100%; height: 100%; display: block; }
  .hero.left svg { transform: scaleX(-1); }

  /* HUD */
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; z-index: 10; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .logo { font: 13px/1.4 var(--pix); color: var(--paper); text-shadow: 2px 2px 0 var(--ink); }
  .logo small { display: block; font: 600 15px var(--body); text-shadow: 2px 2px 0 var(--ink); color: #fff; }
  .hbtns { display: flex; gap: 8px; align-items: center; }
  .pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font: 10px/1.2 var(--pix); text-decoration: none; color: var(--ink); white-space: nowrap; }
  .pbtn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .pbtn.gold { background: var(--gold); }
  .pbtn.dark { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 #000; }
  .stars { font: 11px var(--pix); color: var(--gold); text-shadow: 2px 2px 0 var(--ink); }

  /* dialog */
  .dialog { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); width: min(640px, calc(100% - 24px)); max-height: 48vh; overflow: auto; background: var(--paper); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px 18px; z-index: 9; }
  .dialog.swap { animation: pop .28s steps(4); }
  @keyframes pop { from { transform: translate(-50%, 10px); opacity: 0; } }
  .dialog .lv { font: 9px var(--pix); color: var(--orange); margin-bottom: 6px; }
  .dialog h2 { font: 15px/1.4 var(--pix); margin: 0 0 8px; }
  .dialog p { margin: 0 0 8px; }
  .dialog ul { margin: 0 0 8px; padding-left: 20px; }
  .dialog li { margin: 2px 0; }
  .dialog li::marker { content: "▸ "; color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { font: 600 14px var(--body); padding: 1px 8px; border: 2px solid var(--ink); background: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .muted { color: #6b5e4a; font-size: 15px; }

  /* controls */
  .track { position: fixed; left: 70px; right: 70px; bottom: 18px; height: 34px; z-index: 9; display: flex; align-items: center; }
  .track .bar { position: absolute; left: 0; right: 0; height: 6px; background: rgba(27,21,48,.45); }
  .track .fill { position: absolute; left: 0; height: 6px; background: var(--gold); }
  .track button { position: absolute; transform: translateX(-50%); width: 18px; height: 18px; padding: 0; background: var(--paper); border: 3px solid var(--ink); }
  .track button.on { background: var(--gold); }
  .track button span { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font: 8px var(--pix); white-space: nowrap; color: var(--paper); text-shadow: 2px 2px 0 var(--ink); }
  .arrow { position: fixed; bottom: 10px; z-index: 9; width: 50px; height: 50px; font: 16px var(--pix); background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .arrow.l { left: 10px; } .arrow.r { right: 10px; }
  .hint { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); font: 9px/1.6 var(--pix); color: #fff; text-shadow: 2px 2px 0 var(--ink); z-index: 8; white-space: nowrap; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* modal + list view */
  .modal { position: fixed; inset: 0; background: rgba(27,21,48,.7); z-index: 30; display: none; place-items: center; padding: 16px; }
  .modal.open { display: grid; }
  .modal .box { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--paper); border: 4px solid var(--ink); box-shadow: 8px 8px 0 #000; padding: 18px; }
  .modal img { width: 100%; border: 3px solid var(--ink); display: block; margin-bottom: 10px; }
  .modal h3 { font: 14px/1.4 var(--pix); margin: 0 0 8px; }
  .list { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow-y: auto; display: none; }
  .list.open { display: block; }
  .list .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }
  .list .top { position: sticky; top: 0; background: var(--paper); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 4px solid var(--ink); z-index: 1; }
  .list h1 { font: 16px/1.4 var(--pix); margin: 0; }
  .list h2 { font: 12px var(--pix); color: var(--orange); margin: 28px 0 10px; }
  .list h3 { margin: 0; font-size: 19px; }
  .list .item { border: 3px solid var(--ink); background: #fff; padding: 12px 14px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--ink); }
  .list .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .list .projects img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top; border: 2px solid var(--ink); }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .hud { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; }
    .hud .head { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 11px; }
    .logo small { font-size: 13px; }
    .hbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pbtn { padding: 8px 4px; font-size: 8.5px; }
    .dialog { top: 112px; max-height: 44vh; padding: 12px 14px; }
    .dialog h2 { font-size: 12px; }
    .track { left: 66px; right: 66px; }
    .track button span { display: none; }
    .hint { bottom: 70px; font-size: 8px; }
    .list .projects { grid-template-columns: 1fr; }
  }
  @media (min-width: 761px) { .hud .head { display: contents; } }
  @media (prefers-reduced-motion: reduce) { .hint, .dialog.swap { animation: none; } }
</style>
</head>

<script>
(() => {
const D = window.DATA;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (ym) => { if (!ym) return 'now'; const [y, m] = ym.split('-'); return new Date(+y, +m - 1).toLocaleString('en', { month: 'short' }) + ' ' + y; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lab = D.experience.find((e) => e.role === 'Lab Assistant');
const sentra = D.experience[0], utmFe = D.experience[1], rg = D.experience[2];
$('#cvBtn').href = D.cv;

/* ---------- pixel sprites ---------- */
const PAL = { h: '#1c1917', s: '#c68642', e: '#1c1917', t: '#14b8a6', l: '#60a5fa', p: '#1e3a8a', b: '#111827', w: '#ffffff' };
const HEAD = ['....hhhh....', '...hhhhhhh..', '..hhhhhhhhh.', '..hhssssshh.', '..hsesssesh.', '..hsssssss..', '...ssssss...', '....ssss....', '..tlttttlt..', '.tttlttlttt.', 's.tttllttt.s', 's.tttttttt.s', '..pppppppp..'];
const LEGS = [['..ppp..ppp..', '..ppp..ppp..', '.bbbb..bbbb.'], ['..ppp...pp..', '.ppp....pp..', '.bbb....bbb.'], ['..pp...ppp..', '..pp....ppp.', '.bbb....bbb.']];
function sprite(rows, pal = PAL) {
  const w = rows[0].length, h = rows.length;
  let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (pal[c]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[c]}"/>`; }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}
const FRAMES = LEGS.map((l) => sprite([...HEAD, ...l]));
const CLOUD = sprite(['....wwww........', '..wwwwwwww.www..', '.wwwwwwwwwwwwww.', 'wwwwwwwwwwwwwwww', '.wwwwwwwwwwwwww.'], { w: '#ffffff' });

/* ---------- stations (world units; 1 unit = stage height / 720) ---------- */
const S = [
  { id: 'start', x: 0, lv: 'START', name: 'Lamongan',
    html: () => `<div class="lv">PLAYER 1 · LAMONGAN, INDONESIA</div><h2>${esc(D.name)}</h2>
      <p><b>Software Developer</b> — PHP · Laravel · React · PostgreSQL. Currently shipping higher-ed platforms used by <b>400+ universities</b>.</p>
      <p class="muted">Walk right to play through the career, or jump straight to what you need:</p>
      <div class="row"><button class="pbtn gold" data-go="arcade">Projects</button><button class="pbtn" data-go="sentra">Current job</button><a class="pbtn" href="${D.cv}" target="_blank" rel="noopener">CV ↓</a><button class="pbtn dark" data-go="contact">Contact</button></div>` },
  { id: 'school', x: 900, lv: '2016–2019', name: 'MAN 1 Lamongan',
    html: () => `<div class="lv">LEVEL 1 · 2016–2019</div><h2>${esc(D.education[1].school)}</h2><p>${esc(D.education[1].degree)}. ${esc(D.education[1].detail)}</p>
      <ul><li>🏆 ${esc(D.achievements[1].title)} (${esc(D.achievements[1].date)})</li></ul>` },
  { id: 'campus', x: 1800, lv: '2019–', name: 'UTM campus',
    html: () => `<div class="lv">LEVEL 2 · 2019 →</div><h2>${esc(D.education[0].school)}</h2><p>${esc(D.education[0].degree)} — ${esc(D.education[0].detail)}</p>
      <p><b>Side quest: ${esc(lab.role)}</b> <span class="muted">(${fmt(lab.start)} – ${fmt(lab.end)})</span><br>${esc(lab.highlights[0])}</p>
      <ul><li>${esc(D.achievements[0].title)} (2022)</li>${D.organizations.map((o) => `<li>${esc(o.role)} — ${esc(o.org)}</li>`).join('')}</ul>` },
  { id: 'skills', x: 2700, lv: 'POWER-UPS', name: 'Skill blocks',
    html: () => `<div class="lv">BONUS STAGE · POWER-UPS</div><h2>Skills collected</h2>${Object.entries(D.skills).map(([g, l]) => `<p style="margin:4px 0 0"><b>${esc(g)}</b></p><div class="chips">${l.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>`).join('')}` },
  { id: 'bootcamp', x: 3900, lv: '2022', name: 'Ruangguru camp',
    html: () => `<div class="lv">LEVEL 3 · ${fmt(rg.start).toUpperCase()} – ${fmt(rg.end).toUpperCase()}</div><h2>${esc(rg.role)} — Ruangguru</h2>
      <p>Kampus Merdeka independent study. Finished with a <b>final GPA of 4.00</b>.</p>
      <ul><li>Built <b>CodeIn</b> (React, Tailwind, Go) — a forum for Indonesian programmers.</li></ul>` },
  { id: 'lanjalan', x: 4800, lv: '2022–2023', name: 'Lanjalan · Madura',
    html: () => `<div class="lv">LEVEL 4 · ${fmt(utmFe.start).toUpperCase()} – ${fmt(utmFe.end).toUpperCase()}</div><h2>${esc(utmFe.role)} — ${esc(utmFe.company)}</h2>
      <ul>${utmFe.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
      <div class="row"><a class="pbtn" href="${D.projects[1].website}" target="_blank" rel="noopener">Play Lanjalan ↗</a></div>` },
  { id: 'sentra', x: 5800, lv: 'NOW', name: 'Sentra Vidya HQ',
    html: () => `<div class="lv">LEVEL 5 · ${fmt(sentra.start).toUpperCase()} – NOW · CURRENT</div><h2>${esc(sentra.role)} — ${esc(sentra.company)}</h2>
      <ul>${sentra.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` },
  { id: 'arcade', x: 6800, lv: 'ARCADE', name: 'Project arcade',
    html: () => `<div class="lv">ARCADE · ${D.projects.length} CABINETS</div><h2>Projects</h2><p class="muted">Click a cabinet (or a name) to play.</p>
      <div class="chips">${D.projects.map((p, i) => `<button class="chip" data-proj="${i}">${esc(p.title)}</button>`).join('')}</div>` },
  { id: 'certs', x: 8600, lv: '23 BADGES', name: 'Hall of badges',
    html: () => `<div class="lv">TROPHY ROOM · ${D.certificates.length} BADGES</div><h2>Certificates</h2>
      <ul>${D.certificates.map((c, i) => `<li><button class="chip" style="border:0;background:none;padding:0;text-align:left;text-decoration:underline" data-cert="${i}">${esc(c.title)}</button> <span class="muted">— ${esc(c.issuer)}${c.date ? ', ' + esc(c.date) : ''}</span></li>`).join('')}</ul>` },
  { id: 'contact', x: 9500, lv: 'FINISH', name: 'Contact',
    html: () => `<div class="lv">STAGE CLEAR ★</div><h2>Thanks for playing!</h2><p>Want this player on your team? Insert coin:</p>
      <div class="row"><a class="pbtn gold" href="mailto:${D.email}">✉ ${D.email}</a><a class="pbtn" href="${D.cv}" target="_blank" rel="noopener">CV ↓</a></div>
      <p style="margin-top:10px">${esc(D.phone)} · ${D.socials.slice(0, 3).map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}</p>` },
];
const END = 10100;

/* ---------- build the world ---------- */
const U = (n) => `calc(var(--u) * ${n})`;
const world = $('#world'), mid = $('#mid'), far = $('#far');
const add = (parent, html) => { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; };
world.style.width = U(END + 1600);
add(world, `<div class="ground" style="left:${U(-2400)};width:${U(END + 4000)}"></div>`);
// far clouds + mid hills
for (let i = 0; i < 18; i++) add(far, `<div class="cloud" style="left:${U(i * 520 - 600 + (i % 3) * 90)};top:${U(40 + (i % 4) * 46)};width:${U(130 + (i % 3) * 30)}">${CLOUD}</div>`);
add(mid, `<svg class="hills" style="left:${U(-1200)};width:${U(8000)}" viewBox="0 0 8000 200" preserveAspectRatio="none" aria-hidden="true">${Array.from({ length: 22 }, (_, i) => `<path d="M${i * 380 - 120} 200 L${i * 380 + 80} ${40 + (i % 4) * 30} L${i * 380 + 300} 200Z" fill="${i % 2 ? '#7c9a6d' : '#5f7f57'}" stroke="#1b1530" stroke-width="5"/>`).join('')}</svg>`);

const bld = (x, w, h, c, sign, opts = {}) => add(world, `<div class="obj bld" style="left:${U(x)};width:${U(w)};height:${U(h)};--c:${c};--w:${opts.w || '#93c5fd'};--r:${opts.r || '#b91c1c'}">${opts.roof ? '<div class="roof"></div>' : ''}<div class="win"></div><div class="door"></div><div class="sign" style="top:${U(-46 - (opts.roof ? 60 : 0))}">${esc(sign)}</div></div>`);
const obj = (x, cls, style = '', inner = '') => add(world, `<div class="obj ${cls}" style="left:${U(x)};${style}">${inner}</div>`);

// start: home
bld(260, 220, 170, '#fde68a', 'LAMONGAN', { roof: true, r: '#c2410c' });
obj(80, 'tree'); obj(560, 'tree', `height:${U(110)}`);
// school + trophy
bld(1040, 340, 230, '#bbf7d0', 'MAN 1 LAMONGAN', { roof: true, r: '#15803d' });
obj(1420, 'trophy', `bottom:${U(146)}`); obj(1400, 'bld', `width:${U(90)};height:${U(26)};--c:#a8a29e`);
// campus
bld(1950, 460, 320, '#e0e7ff', 'UNIVERSITAS TRUNOJOYO MADURA', { w: '#fde68a' });
obj(2470, 'tree'); obj(2560, 'tree', `height:${U(150)}`);
// skill blocks
const groups = Object.entries(D.skills);
groups.forEach(([g, list], i) => obj(2780 + i * 170, 'qblock', `bottom:${U(300)}`, `?<span class="coin">${esc(g)} ×${list.length}</span>`));
// bootcamp tent
bld(3980, 300, 190, '#fca5a5', 'RUANGGURU CAMP', { roof: true, r: '#1d4ed8', w: '#fef9c3' });
// lanjalan gate
obj(4880, 'bld', `width:${U(46)};height:${U(260)};--c:#fdba74`); obj(5180, 'bld', `width:${U(46)};height:${U(260)};--c:#fdba74`);
obj(4860, 'bld', `width:${U(390)};height:${U(46)};bottom:${U(380)};--c:#fb923c`, `<div class="sign" style="top:${U(4)};font-size:${U(13)}">LANJALAN · MADURA →</div>`);
// sentra tower
bld(5900, 300, 480, '#c7d2fe', 'SENTRA VIDYA UTAMA', { w: '#facc15' });
obj(6220, 'bld', `width:${U(170)};height:${U(64)};bottom:${U(470)};--c:#fbbf24`, `<div class="sign" style="top:${U(10)};font-size:${U(14)};background:#fbbf24">400+ UNIV</div>`);
// arcade cabinets
const cabColors = ['#7c3aed', '#db2777', '#0891b2', '#16a34a', '#ea580c', '#2563eb', '#9333ea', '#dc2626', '#0d9488'];
D.projects.forEach((p, i) => obj(6900 + i * 175, 'cab', `--c:${cabColors[i % 9]};cursor:pointer`, `<div class="mq">${esc(p.title)}</div><img src="${p.thumb}" alt=""><div class="pad"></div>`).dataset.proj = i);
// certificate library
const bookC = ['#14b8a6', '#f97316', '#fbbf24', '#60a5fa', '#f87171', '#a78bfa', '#4ade80'];
obj(8650, 'books', '', D.certificates.slice(0, 23).map((_, i) => `<i style="height:${U(60 + ((i * 37) % 40))};background:${bookC[i % 7]}"></i>`).join(''));
obj(8930, 'trophy', `bottom:${U(146)}`); obj(8910, 'bld', `width:${U(90)};height:${U(26)};--c:#a8a29e`);
// finish
obj(9640, 'flag'); obj(9860, 'mailbox', `bottom:${U(190)}`);
obj(10050, 'tree'); obj(10200, 'tree', `height:${U(160)}`);

/* ---------- track (fast travel) ---------- */
const track = $('#track');
S.forEach((s) => add(track, `<button data-go="${s.id}" style="left:${(s.x / END) * 100}%" aria-label="Go to ${esc(s.name)}"><span>${esc(s.lv)}</span></button>`));

/* ---------- movement ---------- */
let x = 0, tx = 0, unit = 1, hold = 0, face = 1, frame = 0, active = -1, lastStep = 0;
const hero = $('#hero');
const heroScreenX = () => innerWidth * (innerWidth < 760 ? 0.2 : 0.3);
function layout() {
  unit = innerHeight / 720;
  document.documentElement.style.setProperty('--u', unit + 'px');
  hero.style.left = heroScreenX() + 'px';
}
addEventListener('resize', layout); layout();
const clamp = (v) => Math.max(0, Math.min(END, v));
function go(id) { const s = S.find((q) => q.id === id); if (s) tx = s.x + 40; closeModal(); }

addEventListener('wheel', (e) => { if (e.target.closest('.dialog, .modal, .list')) return; e.preventDefault(); tx = clamp(tx + (e.deltaY + e.deltaX) * 1.1 / unit); }, { passive: false });
let touch = null;
$('#stage').addEventListener('touchstart', (e) => { touch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
$('#stage').addEventListener('touchmove', (e) => {
  if (!touch) return;
  const dx = touch[0] - e.touches[0].clientX, dy = touch[1] - e.touches[0].clientY;
  tx = clamp(tx + (Math.abs(dx) > Math.abs(dy) ? dx : dy) * 2.2 / unit);
  touch = [e.touches[0].clientX, e.touches[0].clientY];
}, { passive: true });
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'Escape') { closeModal(); $('#list').classList.remove('open'); }
  if ($('#list').classList.contains('open') || $('#modal').classList.contains('open')) return;
  if (['ArrowRight', 'd', 'D'].includes(e.key)) hold = 1;
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) hold = -1;
});
addEventListener('keyup', (e) => { if (['ArrowRight', 'ArrowLeft', 'a', 'A', 'd', 'D'].includes(e.key)) hold = 0; });
for (const [id, dir] of [['#left', -1], ['#right', 1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', () => { hold = dir; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => { hold = 0; }));
  b.addEventListener('click', () => { if (!hold) tx = clamp(tx + dir * 300); });
}

/* ---------- skills blocks + stars ---------- */
const blocks = [...world.querySelectorAll('.qblock')];
const total = Object.values(D.skills).flat().length;
let stars = 0;

function setDialog(i) {
  if (i === active) return;
  active = i;
  const d = $('#dialog');
  d.innerHTML = S[i].html();
  d.scrollTop = 0;
  d.classList.remove('swap'); void d.offsetWidth; if (!reduce) d.classList.add('swap');
  $('#lvl').textContent = `World ${i + 1} · ${S[i].name}`;
  track.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k <= i));
}

function loop(t) {
  if (hold) tx = clamp(tx + hold * 9);
  const dx = tx - x;
  x += reduce ? dx : dx * 0.12;
  if (Math.abs(dx) < 0.3) x = tx;
  const moving = Math.abs(dx) > 1;
  if (moving) { face = dx > 0 ? 1 : -1; if (t - lastStep > 110) { frame = frame === 1 ? 2 : 1; lastStep = t; } } else frame = 0;
  hero.innerHTML = FRAMES[frame];
  hero.classList.toggle('left', face < 0);
  const px = x * unit;
  world.style.transform = `translate3d(${heroScreenX() - px}px,0,0)`;
  mid.style.transform = `translate3d(${-px * 0.35}px,0,0)`;
  far.style.transform = `translate3d(${-px * 0.12}px,0,0)`;
  // sky shifts dawn → day → dusk → night with progress
  const k = x / END;
  const sky = k < 0.33 ? ['#ffcf8a', '#ff9e7a'] : k < 0.66 ? ['#7dd3fc', '#bae6fd'] : k < 0.9 ? ['#f9a8d4', '#fb923c'] : ['#312e81', '#6d28d9'];
  document.documentElement.style.setProperty('--sky1', sky[0]); document.documentElement.style.setProperty('--sky2', sky[1]);
  $('#fill').style.width = k * 100 + '%';
  // stations
  let i = 0; S.forEach((s, k2) => { if (x + 260 >= s.x) i = k2; });
  setDialog(i);
  // skill blocks pop as the hero passes under them
  blocks.forEach((b, k2) => {
    const bx = 2780 + k2 * 170;
    if (!b.classList.contains('hit') && x + 40 >= bx) { b.classList.add('hit'); stars += groups[k2][1].length; $('#stars').textContent = `★ ${stars}/${total} skills`; }
  });
  if (x > 60) $('#hint').style.display = 'none';
  requestAnimationFrame(loop);
}

/* ---------- modal, list view, routing ---------- */
const modal = $('#modal');
function openModal(html) { $('#modalBox').innerHTML = html + '<div class="row" style="margin-top:12px"><button class="pbtn dark" data-close>Close</button></div>'; modal.classList.add('open'); $('#modalBox [data-close]').focus(); }
function closeModal() { modal.classList.remove('open'); }
function projHtml(p) {
  return `<img src="${p.thumb}" alt="Screenshot of ${esc(p.title)}"><h3>${esc(p.title)}</h3><div class="chips">${p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div><p>${esc(p.description)}</p>
  <div class="row">${p.website ? `<a class="pbtn gold" href="${p.website}" target="_blank" rel="noopener">Play live ↗</a>` : ''}${p.github ? `<a class="pbtn" href="${p.github}" target="_blank" rel="noopener">Source ↗</a>` : ''}${!p.website && !p.github ? '<span class="muted">Private project — screenshots only.</span>' : ''}</div>`;
}
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { $('#list').classList.remove('open'); go(g.dataset.go); return; }
  const p = e.target.closest('[data-proj]'); if (p) { openModal(projHtml(D.projects[+p.dataset.proj])); return; }
  const c = e.target.closest('[data-cert]'); if (c) { const ce = D.certificates[+c.dataset.cert]; openModal(`<img src="${ce.thumb}" alt="Certificate: ${esc(ce.title)}"><h3>${esc(ce.title)}</h3><p>${esc(ce.issuer)}${ce.date ? ' · ' + esc(ce.date) : ''}</p>`); return; }
  if (e.target.closest('[data-close]') || e.target === modal) closeModal();
});

$('#listBody').innerHTML = `
  <div class="top"><h1>${esc(D.name)}</h1><button class="pbtn gold" id="listClose">▶ Back to the game</button></div>
  <p style="margin-top:16px"><b>Software Developer</b> · ${esc(D.location)} · <a href="mailto:${D.email}">${D.email}</a> · <a href="${D.cv}" target="_blank" rel="noopener">CV (PDF)</a> · ${D.socials.slice(0, 2).map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}</p>
  <p>${esc(D.about)}</p>
  <h2>EXPERIENCE</h2>${D.experience.map((e) => `<div class="item"><h3>${esc(e.role)} — ${esc(e.company)}</h3><div class="muted">${fmt(e.start)} – ${fmt(e.end)}</div><ul>${e.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>`).join('')}
  <h2>PROJECTS</h2><div class="projects">${D.projects.map((p, i) => `<div class="item"><img src="${p.thumb}" alt=""><h3>${esc(p.title)}</h3><div class="chips">${p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div><button class="pbtn" data-proj="${i}">Details</button></div>`).join('')}</div>
  <h2>SKILLS</h2>${Object.entries(D.skills).map(([g, l]) => `<p style="margin:6px 0 0"><b>${esc(g)}</b></p><div class="chips">${l.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div>`).join('')}
  <h2>EDUCATION</h2>${D.education.map((e) => `<div class="item"><h3>${esc(e.degree)}</h3><div class="muted">${esc(e.school)} · ${esc(e.period)}</div><p style="margin:4px 0 0">${esc(e.detail)}</p></div>`).join('')}
  <h2>CERTIFICATES</h2><ul>${D.certificates.map((c) => `<li>${esc(c.title)} <span class="muted">— ${esc(c.issuer)}${c.date ? ', ' + esc(c.date) : ''}</span></li>`).join('')}</ul>`;
$('#listBtn').onclick = () => { $('#list').classList.add('open'); $('#list').scrollTop = 0; };
$('#listClose').onclick = () => $('#list').classList.remove('open');

const q = new URLSearchParams(location.search).get('open');
if (q === 'list') $('#list').classList.add('open');
else if (q) { const s = S.find((z) => z.id === q); if (s) { x = tx = s.x + 40; } }
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
