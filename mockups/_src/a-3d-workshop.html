<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhammad Fahmi Ady Susilo — The Night Desk (concept A)</title>
<meta name="description" content="Software Developer from Lamongan, Indonesia. Explore a 3D desk: every object opens a part of the portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1120;
    --ink: #eef1f8;
    --muted: #9aa3bd;
    --line: rgba(255,255,255,.12);
    --panel: rgba(16,21,38,.92);
    --teal: #12f3d8;
    --orange: #f97316;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.55 "Space Grotesk", system-ui, sans-serif; }
  body { overflow: hidden; }
  a { color: var(--teal); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* top bar */
  .top { position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(#0d1120e6, #0d112000); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 22px; pointer-events: none; z-index: 5; }
  .brand { pointer-events: auto; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .brand p b { color: var(--teal); font-weight: 600; }
  .actions { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(13,17,32,.7); backdrop-filter: blur(8px); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--teal); }
  .btn.primary { background: var(--teal); color: #04201c; border-color: var(--teal); }

  /* hotspots */
  #hotspots { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .hs { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 7px; border-radius: 999px; background: rgba(13,17,32,.78); border: 1px solid var(--line); color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: border-color .2s, background .2s, opacity .3s; }
  .hs::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(249,115,22,.25); animation: pulse 2.2s infinite; }
  .hs:hover, .hs.on { border-color: var(--orange); background: rgba(40,24,14,.9); }
  .hs.dim { opacity: .25; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(249,115,22,0); } }

  .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: var(--muted); font-size: 12.5px; z-index: 2; background: rgba(13,17,32,.6); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }

  /* mobile section dock */
  .dock { display: none; }

  /* side panel */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); backdrop-filter: blur(14px); border-left: 1px solid var(--line); z-index: 8; transform: translateX(105%); visibility: hidden; transition: transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s .45s; display: flex; flex-direction: column; }
  .panel.open { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .panel.instant { transition: none; }
  .panel header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .panel header h2 { margin: 0; font-size: 18px; }
  .panel header small { display: block; color: var(--orange); font: 600 11px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
  .x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; }
  .panel .body { overflow-y: auto; padding: 18px 22px 40px; overscroll-behavior: contain; }

  /* content blocks (shared by panel + quick view) */
  .proj { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .proj img { width: 112px; height: 72px; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); }
  .proj h3 { margin: 0 0 4px; font-size: 15px; }
  .proj p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
  .tag { font: 600 10.5px "JetBrains Mono", monospace; padding: 2px 7px; border-radius: 5px; background: rgba(18,243,216,.1); color: var(--teal); }
  .links { display: flex; gap: 12px; font-size: 13px; font-weight: 600; }
  .job { position: relative; padding: 0 0 18px 18px; border-left: 2px solid var(--line); margin-left: 4px; }
  .job::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); }
  .job h3 { margin: 0; font-size: 15px; }
  .job .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
  .job ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
  .job li { margin: 3px 0; }
  .badge { font: 600 10px "JetBrains Mono", monospace; background: var(--orange); color: #1b0d03; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
  .skillgrp { margin: 0 0 14px; }
  .skillgrp h4 { margin: 0 0 6px; font: 600 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .chip img { width: 16px; height: 16px; }
  .certs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cert { margin: 0; font-size: 12px; color: var(--muted); }
  .cert img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .cert b { display: block; color: var(--ink); font-size: 12.5px; line-height: 1.3; margin-top: 4px; }
  .about-photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--teal); float: right; margin: 0 0 8px 12px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .lead { font-size: 16px; }
  .sec-title { font: 600 11px "JetBrains Mono", monospace; letter-spacing: .14em; color: var(--orange); text-transform: uppercase; margin: 28px 0 8px; }

  /* quick view (recruiter) */
  .quick { position: fixed; inset: 0; z-index: 20; background: #0b0f1c; overflow-y: auto; display: none; }
  .quick.open { display: block; }
  .quick .wrap { max-width: 860px; margin: 0 auto; padding: 28px 22px 80px; }
  .quick .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; background: #0b0f1c; padding: 14px 0; z-index: 2; border-bottom: 1px solid var(--line); }
  .quick .qhead h2 { margin: 0; font-size: 18px; }
  .quick .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }

  .fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; z-index: 1; }

  @media (max-width: 760px) {
    .top { padding: 14px 14px; flex-direction: column; }
    .actions { justify-content: flex-start; }
    .actions .btn { padding: 8px 12px; }
    .brand h1 { font-size: 17px; }
    .hint { display: none; }
    .hs { font-size: 11.5px; padding: 5px 9px 5px 6px; }
    .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; background: rgba(13,17,32,.85); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 6px; }
    .dock button { border: 0; background: transparent; padding: 7px 2px; border-radius: 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
    .dock button span { display: block; font-size: 17px; line-height: 1.1; }
    .dock button.on { background: rgba(249,115,22,.18); color: var(--orange); }
    .panel { top: auto; height: 72vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%); }
    .quick .cols { grid-template-columns: 1fr; }
    .certs { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hs::before { animation: none; }
    .panel { transition: none; }
  }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>

<div class="top">
  <div class="brand">
    <h1 id="name"></h1>
    <p><b>Software Developer</b> · Lamongan, Indonesia</p>
  </div>
  <nav class="actions" aria-label="Quick links">
    <button class="btn primary" id="quickBtn" type="button">☰ Quick view</button>
    <a class="btn" id="cvBtn" target="_blank" rel="noopener">CV ↓</a>
    <a class="btn" id="mailBtn">Email</a>
  </nav>
</div>

<div id="hotspots"></div>
<div class="hint">Drag to look around · click an object on the desk</div>
<nav class="dock" id="dock" aria-label="Sections"></nav>

<aside class="panel" id="panel" aria-live="polite" aria-hidden="true">
  <header><div><small id="pKicker"></small><h2 id="pTitle"></h2></div><button class="x" id="pClose" type="button" aria-label="Close panel">×</button></header>
  <div class="body" id="pBody"></div>
</aside>

<section class="quick" id="quick" aria-label="Quick view">
  <div class="wrap">
    <div class="qhead"><h2>Quick view — everything on one page</h2><button class="btn" id="quickClose" type="button">Back to the desk</button></div>
    <div id="quickBody"></div>
  </div>
</section>

<div class="fallback" id="fallback"><p>3D is not available on this device — showing the quick view.</p></div>

<script>window.DATA = /*@DATA@*/;</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const D = window.DATA;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = (ym) => {
  if (!ym) return 'Present';
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1).toLocaleString('en', { month: 'short' }) + ' ' + y;
};

$('#name').textContent = D.name;
$('#cvBtn').href = D.cv;
$('#mailBtn').href = 'mailto:' + D.email;

/* ---------- section renderers (shared by panel + quick view) ---------- */
const R = {
  about: () => `
    <img class="about-photo" src="${D.photo}" alt="Portrait of ${esc(D.name)}">
    <p class="lead">${esc(D.about)}</p>
    <p>Currently building higher-education platforms used by <b>400+ universities</b> at Sentra Vidya Utama.</p>
    <dl class="kv"><dt>Based in</dt><dd>${esc(D.location)}</dd><dt>Email</dt><dd><a href="mailto:${D.email}">${D.email}</a></dd><dt>Phone</dt><dd>${esc(D.phone)}</dd></dl>`,
  projects: () => D.projects.map((p) => `
    <article class="proj">
      <img src="${p.thumb}" alt="Screenshot of ${esc(p.title)}">
      <div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>
        <div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="links">${p.website ? `<a href="${p.website}" target="_blank" rel="noopener">Live ↗</a>` : ''}${p.github ? `<a href="${p.github}" target="_blank" rel="noopener">Code ↗</a>` : ''}${!p.website && !p.github ? '<span style="color:var(--muted)">Private project</span>' : ''}</div>
      </div>
    </article>`).join(''),
  experience: () => D.experience.map((e) => `
    <div class="job"><h3>${esc(e.role)}${e.latest ? '<span class="badge">NOW</span>' : ''}</h3>
      <div class="meta">${esc(e.company)} · ${fmt(e.start)} – ${fmt(e.end)}</div>
      <ul>${e.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>`).join(''),
  skills: () => Object.entries(D.skills).map(([g, list]) => `
    <div class="skillgrp"><h4>${esc(g)}</h4><div class="chips">${list.map((s) => `<span class="chip">${D.skillIcons[s] ? `<img src="${D.skillIcons[s]}" alt="">` : ''}${esc(s)}</span>`).join('')}</div></div>`).join(''),
  education: () => `
    ${D.education.map((e) => `<div class="job"><h3>${esc(e.degree)}</h3><div class="meta">${esc(e.school)} · ${esc(e.period)}</div><ul><li>${esc(e.detail)}</li></ul></div>`).join('')}
    <div class="sec-title">Awards</div>
    ${D.achievements.map((a) => `<div class="job"><h3>${esc(a.title)}</h3><div class="meta">${esc(a.date)}</div></div>`).join('')}
    <div class="sec-title">Organizations</div>
    ${D.organizations.map((o) => `<div class="job"><h3>${esc(o.role)}</h3><div class="meta">${esc(o.org)} · ${esc(o.period)}</div></div>`).join('')}`,
  certificates: () => `<div class="certs">${D.certificates.map((c) => `
    <figure class="cert"><img src="${c.thumb}" alt=""><b>${esc(c.title)}</b>${esc(c.issuer)}${c.date ? ' · ' + esc(c.date) : ''}</figure>`).join('')}</div>`,
  contact: () => `
    <p class="lead">Open to software developer roles and freelance projects. Fastest reply: email.</p>
    <p><a class="btn primary" href="mailto:${D.email}">✉ ${D.email}</a></p>
    <p><a class="btn" href="${D.cv}" target="_blank" rel="noopener">Download CV (PDF)</a></p>
    <dl class="kv"><dt>Phone</dt><dd>${esc(D.phone)}</dd>${D.socials.map((s) => `<dt>${esc(s.name)}</dt><dd><a href="${s.url}" target="_blank" rel="noopener">${esc(s.handle)}</a></dd>`).join('')}</dl>`,
};

const SECTIONS = [
  { id: 'projects', label: 'Projects', icon: '🖥', kicker: 'The monitor', title: 'Projects' },
  { id: 'experience', label: 'Experience', icon: '📌', kicker: 'The corkboard', title: 'Experience' },
  { id: 'skills', label: 'Skills', icon: '⌨', kicker: 'The keyboard', title: 'Skills' },
  { id: 'about', label: 'About', icon: '🖼', kicker: 'The photo frame', title: 'About me' },
  { id: 'certificates', label: 'Certs', icon: '📚', kicker: 'The bookshelf', title: 'Certificates (23)' },
  { id: 'education', label: 'Education', icon: '🏆', kicker: 'The trophy', title: 'Education & awards' },
  { id: 'contact', label: 'Contact', icon: '📱', kicker: 'The phone', title: 'Contact' },
  { id: 'cv', label: 'CV', icon: '📄', kicker: '', title: '' },
];

/* ---------- panel ---------- */
const panel = $('#panel');
let current = null;
function openSection(id) {
  if (id === 'cv') { window.open(D.cv, '_blank', 'noopener'); return; }
  const s = SECTIONS.find((x) => x.id === id);
  current = id;
  $('#pKicker').textContent = s.kicker;
  $('#pTitle').textContent = s.title;
  $('#pBody').innerHTML = R[id]();
  $('#pBody').scrollTop = 0;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  document.querySelectorAll('[data-sec]').forEach((b) => b.classList.toggle('on', b.dataset.sec === id));
  focusObject(id);
}
function closePanel() {
  current = null;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  document.querySelectorAll('[data-sec]').forEach((b) => b.classList.remove('on'));
  focusObject(null);
}
$('#pClose').onclick = closePanel;
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePanel(); closeQuick(); } });

/* ---------- quick view ---------- */
$('#quickBody').innerHTML = `
  <div style="display:flex;gap:18px;align-items:center;margin:24px 0 8px">
    <img src="${D.photo}" alt="" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--teal)">
    <div><h1 style="margin:0;font-size:26px">${esc(D.name)}</h1><div style="color:var(--muted)">Software Developer · ${esc(D.location)}</div>
    <div class="links" style="margin-top:6px"><a href="mailto:${D.email}">${D.email}</a><a href="${D.cv}" target="_blank" rel="noopener">CV (PDF)</a><a href="${D.socials[0].url}" target="_blank" rel="noopener">GitHub</a><a href="${D.socials[1].url}" target="_blank" rel="noopener">LinkedIn</a></div></div>
  </div>
  <p>${esc(D.about)}</p>
  <div class="sec-title">Experience</div>${R.experience()}
  <div class="sec-title">Projects</div>${R.projects()}
  <div class="cols"><div><div class="sec-title">Skills</div>${R.skills()}</div><div><div class="sec-title">Education</div>${R.education()}</div></div>
  <div class="sec-title">Certificates</div>${R.certificates()}`;
const quick = $('#quick');
function openQuick() { quick.classList.add('open'); quick.scrollTop = 0; }
function closeQuick() { quick.classList.remove('open'); }
$('#quickBtn').onclick = openQuick;
$('#quickClose').onclick = closeQuick;

/* ---------- mobile dock ---------- */
$('#dock').innerHTML = SECTIONS.map((s) => `<button type="button" data-sec="${s.id}"><span aria-hidden="true">${s.icon}</span>${s.label}</button>`).join('');
$('#dock').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) openSection(b.dataset.sec); });

/* ---------- 3D scene ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  $('#fallback').style.display = 'grid';
  openQuick();
  throw err;
}
const stage = $('#stage');
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth < 760 ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1120');
scene.fog = new THREE.Fog('#0d1120', 14, 26);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.35;
controls.minAzimuthAngle = -0.15;
controls.maxAzimuthAngle = Math.PI / 2 + 0.15;

const HOME = { pos: new THREE.Vector3(7.2, 5.6, 7.6), target: new THREE.Vector3(-0.4, 1.0, -0.6) };

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0, ...o });
const box = (w, h, d, m, r = 0) => {
  const g = r ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
};
const at = (obj, x, y, z, parent = scene) => { obj.position.set(x, y, z); parent.add(obj); return obj; };

// canvas texture helper — draws text, never tainted
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const loader = new THREE.TextureLoader();
const imgTex = (url) => { const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; return t; };

// room shell
const floor = box(7, 0.2, 7, mat('#2a2f45'));
at(floor, 0, -0.1, 0);
const rug = box(3.2, 0.02, 2.2, mat('#9a3b12', { roughness: 1 }), 0.01);
at(rug, 0.2, 0.01, 0.4);
const wallMat = mat('#1b2238');
at(box(7, 4, 0.2, wallMat), 0, 2, -3.6);
at(box(0.2, 4, 7, wallMat), -3.6, 2, 0);
// skirting
at(box(7, 0.14, 0.04, mat('#12f3d8', { emissive: '#12f3d8', emissiveIntensity: 0.6 })), 0, 0.07, -3.48);
at(box(0.04, 0.14, 7, mat('#12f3d8', { emissive: '#12f3d8', emissiveIntensity: 0.6 })), -3.48, 0.07, 0);

// window with night sky
const sky = canvasTex(512, 384, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b1a3d'); gr.addColorStop(1, '#253a6b');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`; g.fillRect(Math.random() * w, Math.random() * h * 0.8, 2, 2); }

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let hovered = null, downAt = null;
const pickables = Object.values(objects).map((o) => o.group);
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, true)[0];
  return hit ? hit.object.userData.section : null;
}
function setHover(id) {
  if (hovered === id) return;
  if (hovered) objects[hovered].group.traverse((m) => m.isMesh && m.material.emissive && m.material.emissive.set(m.userData.baseEmissive ?? '#000'));
  hovered = id;
  renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  if (id) objects[id].group.traverse((m) => { if (m.isMesh && m.material.emissive) { m.userData.baseEmissive ??= '#' + m.material.emissive.getHexString(); m.material = m.material.clone(); m.material.emissive.set('#3a2008'); } });
}
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') setHover(pick(e)); });
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const id = pick(e); if (id) openSection(id);
});

/* ---------- camera moves ---------- */
let tween = null;
function flyTo(pos, target) {
  if (reduceMotion) { camera.position.copy(pos); controls.target.copy(target); return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), s: performance.now(), d: 1100 };
}
function focusObject(id) {
  const o = id && objects[id];
  if (o && o.view) {
    const pos = o.view.pos.clone();
    if (innerWidth < 760) pos.add(pos.clone().sub(o.view.target).multiplyScalar(0.45)).add(new THREE.Vector3(0, -0.35, 0)); // back off on phones (panel covers bottom)
    flyTo(pos, o.view.target);
  } else flyTo(homePos(), homeTarget());
}
// portrait screens frame the desk wall head-on with a wider lens; landscape gets the full room
const HOME_PORTRAIT = { pos: new THREE.Vector3(2.9, 3.7, 5.6), target: new THREE.Vector3(-0.1, 1.5, -2.6) };
const portrait = () => innerWidth / innerHeight < 0.8;
function homeTarget() { return portrait() ? HOME_PORTRAIT.target : HOME.target; }
function homePos() {
  if (portrait()) return HOME_PORTRAIT.pos.clone();
  const a = innerWidth / innerHeight;
  return HOME.target.clone().add(HOME.pos.clone().sub(HOME.target).multiplyScalar(a < 1.2 ? 1.3 : 1));
}
const ease = (t) => 1 - Math.pow(1 - t, 3);
let shift = 0; // px the projection centre moves away from the open panel
function applyShift() {
  const w = innerWidth, h = innerHeight, mobile = w < 760;
  const want = current ? (mobile ? h * 0.72 : Math.min(460, w)) : 0;
  shift += (want - shift) * (reduceMotion ? 1 : 0.12);
  if (Math.abs(want - shift) < 0.5) shift = want;
  if (shift < 0.5) { camera.clearViewOffset(); return; }
  if (mobile) camera.setViewOffset(w, h + shift, 0, shift, w, h);
  else camera.setViewOffset(w + shift, h, shift, 0, w, h);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = portrait() ? 58 : 38; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); if (!current) { camera.position.copy(homePos()); controls.target.copy(homeTarget()); } });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.s) / tween.d), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k === 1) tween = null;
  }
  if (!reduceMotion) { bulb.intensity = 9 + Math.sin(t * 3) * 0.25; mug.rotation.y = t * 0.3; }
  controls.update();
  applyShift();
  renderer.render(scene, camera);
  placeHotspots();
});

const qs = new URLSearchParams(location.search).get('open');
if (qs === 'quick') openQuick();
else if (qs) { panel.classList.add('instant'); openSection(qs); requestAnimationFrame(() => panel.classList.remove('instant')); }
</script>
</body>
